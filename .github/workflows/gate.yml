name: Gate

# `make gate` is this repo's merge gate (see CLAUDE.md). On a fresh checkout
# there is never a `.gate-heavy-stamp` (it's gitignored — local dev-loop
# state only), so `make gate` always finds itself in the "cold-cache case"
# and takes the full `gate-heavy` path: every cheap check, the whole Agda
# tower, refuted, probed, and the bug cache. That is the point — CI always
# gets the strong guarantee, never the light-gate bet on unchanged consumers.

on:
  push:
    branches: [main]
  # A `pull_request` filter names the BASE branch, not the head. Every leg
  # targets main, so main is the whole list -- and a PR opened against any
  # other base gets no run at all: no red, no queue, just a PR with no checks,
  # which reads exactly like one with nothing left to wait for.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Keyed on the PR, and ONE pending run is held per group: a push to a branch
# whose gate is already queued DISPLACES the waiter rather than cancelling the
# runner, so only the newest push is ever waiting. What that costs scales with
# the run, so it bites on a cold cache and barely at all on a warm one.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # The 13m-35m range in typecheck-performance-numbers.md is a single
    # fastest-recorded LOCAL run per tower size, not a CI reading -- the one
    # completed CI run so far took ~74 min for `make gate` alone (~1h36m
    # total, toolchain cache cold) on this shared runner. Generous on
    # purpose; tighten once more real runs land.
    timeout-minutes: 120
    steps:
      # fetch-depth: 0 (full history) -- comments-check resolves `RECOVERY:`
      # shas with `git cat-file`, and those name ordinary ancestor commits
      # that a shallow (default depth-1) clone simply does not have, so the
      # lookup fails and a genuine, resolvable reference reads as dangling.
      #
      # AND IT BUYS ANCESTORS ONLY, WHICH IS THE TRAP: checkout fetches the
      # full history OF THE CHECKED-OUT REF, not every branch. A sha on a
      # feature branch resolves in the working copy that wrote it and is
      # unreachable here the moment that branch is squash-merged -- the
      # squash commit is a fresh object, so the branch's own commits never
      # become ancestors of main. So a `RECOVERY:` sha must name a commit on
      # MAIN. The local check cannot see this, because locally the branch is
      # still there; it fails first in CI, on main, after the merge.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `make gate`'s cheap path now includes `ts-gate` (tsc, eslint,
      # prettier), so the TS toolchain has to be here before the gate runs.
      # It is seconds and needs no Agda, which is why it sits above the
      # toolchain build rather than beside it: a TS error should fail this
      # job in under a minute, not after the tower.
      #
      # AND `cache: npm` IS THE WHOLE OF WHAT THIS SIDE NEEDS. The key hits,
      # and against it the install and the whole TS gate are each a few
      # seconds, so caching `node_modules` on top or wiring up
      # `tsc --incremental` and `eslint --cache` would buy about a second
      # apiece and add a staleness surface to checks whose job is to be
      # trusted. Measured, so the question is closed rather than re-asked:
      # typecheck-performance-numbers.md, under *The gate in CI*.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install TypeScript deps
        run: cd typescript && npm ci

      # Runs first, before the expensive toolchain build: a broken swap step
      # should fail in seconds, not after a 20-minute cold Agda build.
      # A cold full-tower check has peaked near this container's RAM ceiling
      # on one deeply-nested-mutual-block module and been OOM-killed (see
      # .claude/hooks/session-start.sh, which carries the same fix locally).
      # The runner image ships its own active swapfile at this same path, so
      # a bare fallocate here fails with "Text file busy" — drop it first.
      - name: Enable swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # Pin GHC/cabal explicitly rather than letting install-agda.sh's `apt-get
      # install ghc cabal-install` take whatever Ubuntu's apt repo currently
      # defaults to. That default drifts with the runner image — this failed
      # its first real run with apt's GHC 9.14.1 (base-4.22), which Agda 2.8.0
      # rejects (`base >=4.13.0.0 && <4.22`). Versions match the ones already
      # validated in scripts/install-agda.sh's own header comment.
      # cabal-update disabled: haskell-actions/setup's own `cabal update` runs
      # before install-agda.sh gets a chance to patch ~/.cabal/config for TUF
      # secure-repo fetch, and this failed run 2 with "root.json does not have
      # enough signatures signed with the appropriate keys" — install-agda.sh
      # already carries the `secure: False` fix for exactly this, so let it be
      # the one that runs `cabal update`.
      - name: Set up GHC + cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.4.7"
          cabal-version: "3.8.1.0"
          cabal-update: false

      # Building Agda 2.8.0 from source (cabal) is the expensive, cacheable
      # part of toolchain setup; the stdlib clone is small but free to cache
      # alongside it. Keyed on the install script so a version bump there
      # busts the cache automatically.
      - name: Cache Agda toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal
            ~/agda-stdlib-2.3
          key: agda-toolchain-${{ runner.os }}-${{ hashFiles('scripts/install-agda.sh') }}
          restore-keys: |
            agda-toolchain-${{ runner.os }}-

      - name: Install Agda toolchain
        run: bash scripts/install-agda.sh

      - name: Add toolchain to PATH
        run: |
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"
          echo "LC_ALL=C.UTF-8" >> "$GITHUB_ENV"
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"

      # This is NOT the light-gate bet the top-of-file comment refuses: that
      # bet is `.gate-heavy-stamp`, a Makefile-level "skip whole check
      # categories if history looks unchanged" shortcut, deliberately never
      # given to CI. This is Agda's OWN interface cache (`.agdai` files)
      # restored before `make gate` runs. `make gate` still runs the exact
      # same full gate-heavy command, every check category, every file --
      # nothing here changes what gets checked, only whether Agda has to
      # re-elaborate a module whose content (source + imports + the `-W`
      # flags baked into the interface's own validity key) is unchanged
      # since the cached run. That is a per-module, content-hash decision
      # Agda itself makes and re-verifies on every checkout; a stale or
      # missing entry just means normal cold checking for that module, so a
      # bad restore cannot pass something that should fail.
      #
      # TWO separate directories, not one -- Agda resolves each file's
      # build dir by walking UP from the file to the NEAREST enclosing
      # .agda-lib, and `agda/_stripped-comments/evidence/` has its own
      # (`include: refuted probed ../src`), closer to any file actually
      # inside `evidence/refuted` or `evidence/probed` than the top-level
      # one. src files still land in the one shared top-level dir either
      # way, since evidence/.agda-lib is never an ancestor of src/ -- but a
      # refuted or probed file's interface lands under
      # `evidence/_build`, confirmed by running a real evidence check
      # locally and watching that directory appear. Caching only the
      # top-level dir left refuted/probed always cold regardless of this
      # cache -- caught live: a dispatched run on an UNCHANGED commit
      # (so a perfect hit should have made every module instant) sat for
      # real time re-checking `Refuted/Cascade-Nest-PerDeliv.agda`.
      #
      # Save key includes the commit so every green run leaves a fresh
      # snapshot (cache entries are immutable per key); restore-keys drops
      # the commit to pick up the newest prior snapshot regardless of exact
      # match, and Agda decides per-module what in it is still valid.
      - name: Cache Agda interfaces
        uses: actions/cache@v4
        with:
          path: |
            agda/_stripped-comments/_build
            agda/_stripped-comments/evidence/_build
          key: agda-interfaces-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            agda-interfaces-${{ runner.os }}-

      # `make gate` runs the bug cache, which is a GHC compile of the whole
      # MAlonzo cone, stdlib included -- a large fraction of a WARM gate, paid
      # in full every run because this directory was cached by nothing.
      # Restoring it pays because Agda's backend is incremental: it rewrites
      # the `.hs` of the modules whose interfaces moved, and GHC then skips
      # every module whose source did not change. The ones it skips are
      # overwhelmingly the stdlib's, which is also where the bytes are.
      #
      # KEYED ON THE TOOLCHAIN, NOT THE COMMIT, and that is the design rather
      # than a detail: the reusable part is the stdlib's objects, which move
      # only when Agda or the stdlib does, while this repo's own modules are
      # rebuilt every run whatever the cache holds. A commit-keyed entry would
      # upload the tree per green run to store objects that are identical or
      # about to be thrown away, competing for the repo-wide ceiling with
      # interface snapshots worth more per byte. A fixed key hits, and
      # `actions/cache` does not re-save on a hit.
      #
      # The linked binaries are excluded deliberately -- larger than the tree
      # they link from, and relinked every run regardless.
      #
      # Safe for the same reason the interface cache is: GHC re-verifies every
      # module's recompilation condition against the `.hs` Agda just wrote, so
      # a stale or missing entry means ordinary recompilation, never a check
      # that passes when it should fail.
      #
      # Numbers and the full argument: docs/ci-cache.md.
      - name: Cache compiled MAlonzo objects
        uses: actions/cache@v4
        with:
          path: agda/_cli/MAlonzo
          key: agda-cli-${{ runner.os }}-${{ hashFiles('scripts/install-agda.sh') }}

      - name: make gate
        run: make gate
