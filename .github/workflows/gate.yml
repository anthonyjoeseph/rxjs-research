name: Gate

# THE JOBS RUN IN PARALLEL, AND THE SPLIT IS BY HOW LONG A FAILURE TAKES TO
# ARRIVE RATHER THAN BY SUBJECT: a TypeScript error is red before the Agda
# toolchain has finished building.
#
# `make gate` is this repo's merge gate (see CLAUDE.md): every cheap check,
# then `make agda` on `agda-impl/Main.agda`.  The bug cache and the oracle
# run beside it, each from its own compiled binary.

on:
  push:
    branches: [main]
  # A `pull_request` filter names the BASE branch, not the head.  A PR
  # opened against any other base gets no run at all, which reads exactly
  # like one with nothing left to wait for.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# A push to a PR CANCELS the run already going on it (Anthony).  Pushes to
# main are never cancelled, so main's interface cache always advances.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THE FAST SIGNAL.  `make gate` runs `ts-gate` too; the gate stays WHOLE,
  # and the duplicate costs seconds.
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install TypeScript deps
        run: cd typescript && npm ci

      - name: make ts-gate
        run: make ts-gate

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `roadmap-moved` diffs PROOF-STATE against the merge-base with main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install TypeScript deps
        run: cd typescript && npm ci

      - name: Set up Agda
        uses: ./.github/actions/agda-toolchain

      # Keyed on the commit, restored from the newest prefix match: Agda
      # invalidates by content, so a stale interface is rechecked, never
      # trusted.  The `agda-interfaces-` prefix is what cache-prune.yml trims.
      - name: Cache Agda interfaces
        uses: actions/cache@v4
        with:
          path: agda-impl/_build
          key: agda-interfaces-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            agda-interfaces-${{ runner.os }}-

      - name: make gate
        run: make gate

  bug-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Agda
        uses: ./.github/actions/agda-toolchain

      # GHC objects for the stdlib's modules dominate the compile; they move
      # only with the toolchain.
      - name: Cache compiled MAlonzo objects
        uses: actions/cache@v4
        with:
          path: agda-impl/_cli/MAlonzo
          key: agda-cli-${{ runner.os }}-${{ hashFiles('scripts/install-agda.sh') }}

      - name: make bug-cache
        run: make bug-cache

  # The oracle: every drawn program, on all three Agda engines,
  # gives the trace real rxjs does.
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Before any setup, so a missing CLI is red in seconds rather than
      # after the toolchain.  `make oracle-build` repeats it; it is cheap.
      - name: Oracle CLI exists?
        run: |
          test -f agda-impl/quickcheck/Oracle-CLI.agda || {
            echo "oracle: RED — agda-impl/quickcheck/Oracle-CLI.agda does not exist yet"
            exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install TypeScript deps
        run: cd typescript && npm ci

      - name: Set up Agda
        uses: ./.github/actions/agda-toolchain

      - name: Cache compiled MAlonzo objects
        uses: actions/cache@v4
        with:
          path: agda-impl/_cli/MAlonzo
          key: agda-cli-${{ runner.os }}-${{ hashFiles('scripts/install-agda.sh') }}

      - name: make oracle
        run: make oracle

      - name: make stepping
        run: make stepping

      - name: make placing
        run: make placing
